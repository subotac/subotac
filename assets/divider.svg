<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="Animated gradient divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="0.78" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="90" y="17" width="1020" height="2" rx="1" fill="url(#line)"/>
  <circle cx="120" cy="18" r="4" fill="#e0e7ff" filter="url(#glow)">
    <animate attributeName="cx" values="120;1080;120" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#22d3ee;#818cf8;#f472b6;#22d3ee" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
