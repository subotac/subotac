<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Contribution workflow</title>
  <desc id="desc">Three cards: reproduce, fix, and verify.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="1192" height="242" rx="24" fill="#07111f" stroke="#334155" stroke-width="2"/>
  <path d="M335 125 H465 M735 125 H865" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-80" dur="5s" repeatCount="indefinite"/>
  </path>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(55 40)">
      <rect width="280" height="170" rx="19" fill="url(#panel)" stroke="#22d3ee" stroke-width="1.5"/>
      <circle cx="38" cy="39" r="13" fill="none" stroke="#67e8f9" stroke-width="3"/>
      <path d="M47 48 L59 60" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
      <text x="76" y="46" fill="#67e8f9" font-size="19" font-weight="700" letter-spacing="2">REPRODUCE</text>
      <text x="30" y="91" fill="#e2e8f0" font-size="17">Evidence before edits</text>
      <text x="30" y="121" fill="#94a3b8" font-size="14">Minimal case · current main</text>
      <text x="30" y="146" fill="#94a3b8" font-size="14">Expected behavior confirmed</text>
    </g>

    <g transform="translate(460 40)">
      <rect width="280" height="170" rx="19" fill="url(#panel)" stroke="#818cf8" stroke-width="1.5"/>
      <path d="M31 51 L42 28 L53 51 M35 43 H49" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linejoin="round"/>
      <text x="76" y="46" fill="#a5b4fc" font-size="19" font-weight="700" letter-spacing="2">FIX</text>
      <text x="30" y="91" fill="#e2e8f0" font-size="17">Small complete correction</text>
      <text x="30" y="121" fill="#94a3b8" font-size="14">Existing architecture · no churn</text>
      <text x="30" y="146" fill="#94a3b8" font-size="14">One logical reviewable diff</text>
    </g>

    <g transform="translate(865 40)">
      <rect width="280" height="170" rx="19" fill="url(#panel)" stroke="#f472b6" stroke-width="1.5"/>
      <path d="M29 40 L39 51 L58 28" fill="none" stroke="#f9a8d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="46" fill="#f9a8d4" font-size="19" font-weight="700" letter-spacing="2">VERIFY</text>
      <text x="30" y="91" fill="#e2e8f0" font-size="17">Regression test included</text>
      <text x="30" y="121" fill="#94a3b8" font-size="14">Focused tests · lint · format</text>
      <text x="30" y="146" fill="#94a3b8" font-size="14">Broad relevant validation</text>
    </g>
  </g>

  <circle cx="400" cy="125" r="5" fill="#67e8f9" filter="url(#softGlow)">
    <animate attributeName="cx" values="335;465;335" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="125" r="5" fill="#f9a8d4" filter="url(#softGlow)">
    <animate attributeName="cx" values="735;865;735" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
